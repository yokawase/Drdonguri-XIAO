[env:seeed_xiao_esp32s3]
platform = espressif32 @ 6.6.0
board = seeed_xiao_esp32s3
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; 8MB Flash & 8MB PSRAM (OPI) 有効化
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs

build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1          ; ネイティブUSBモード
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; ★最重要：PCからのDTR/RTSリセット信号を常時受信
    -D CORE_DEBUG_LEVEL=0

upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
extra_scripts = post:scripts/post_upload_watchdog_reset.py
